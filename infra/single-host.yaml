AWSTemplateFormatVersion: '2010-09-09'
Description: Single EC2 host running the app and PostgreSQL via docker compose. The ~$50/month option.

Parameters:
  ProjectName:
    Type: String
    Default: seo-platform
  InstanceType:
    Type: String
    Default: t4g.large
    AllowedValues: [t4g.medium, t4g.large, t4g.xlarge]
    Description: t4g.large is 2 vCPU / 8 GB - the database working set needs the memory.
  DataVolumeSizeGb:
    Type: Number
    Default: 60
    Description: Separate EBS volume for PostgreSQL. Survives instance replacement.
  KeyPairName:
    Type: String
    Description: Existing EC2 key pair name for SSH access.
  SshAllowedCidr:
    Type: String
    Default: 0.0.0.0/0
    Description: Lock this to your own IP/32 once the host is up.
  DomainName:
    Type: String
    Default: ''
    Description: Optional. When set together with HostedZoneId, an A record is created.
  HostedZoneId:
    Type: String
    Default: ''

Conditions:
  HasDns: !And
    - !Not [!Equals [!Ref DomainName, '']]
    - !Not [!Equals [!Ref HostedZoneId, '']]

Resources:
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.30.0.0/16
      EnableDnsSupport: true
      EnableDnsHostnames: true
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-vpc' }]

  InternetGateway:
    Type: AWS::EC2::InternetGateway

  GatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties: { VpcId: !Ref Vpc, InternetGatewayId: !Ref InternetGateway }

  Subnet:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.30.1.0/24
      AvailabilityZone: !Select [0, !GetAZs '']
      MapPublicIpOnLaunch: true

  RouteTable:
    Type: AWS::EC2::RouteTable
    Properties: { VpcId: !Ref Vpc }

  DefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: GatewayAttachment
    Properties:
      RouteTableId: !Ref RouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway

  SubnetRouteAssoc:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: { RouteTableId: !Ref RouteTable, SubnetId: !Ref Subnet }

  SecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Web traffic plus SSH
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - { IpProtocol: tcp, FromPort: 80, ToPort: 80, CidrIp: 0.0.0.0/0, Description: HTTP }
        - { IpProtocol: tcp, FromPort: 443, ToPort: 443, CidrIp: 0.0.0.0/0, Description: HTTPS }
        - { IpProtocol: tcp, FromPort: 22, ToPort: 22, CidrIp: !Ref SshAllowedCidr, Description: SSH }
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-sg' }]

  # Lets you open a shell through SSM without exposing SSH at all.
  InstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonSSMManagedInstanceCore
      Policies:
        - PolicyName: read-data-buckets
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: ['s3:GetObject', 's3:ListBucket', 's3:PutObject']
                Resource: ['arn:aws:s3:::seo-pr-*', 'arn:aws:s3:::seo-pr-*/*']

  InstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties: { Roles: [!Ref InstanceRole] }

  # Static address so DNS survives a stop/start of the instance.
  ElasticIp:
    Type: AWS::EC2::EIP
    Properties: { Domain: vpc }

  EipAssociation:
    Type: AWS::EC2::EIPAssociation
    Properties:
      AllocationId: !GetAtt ElasticIp.AllocationId
      InstanceId: !Ref Instance

  DataVolume:
    Type: AWS::EC2::Volume
    DeletionPolicy: Snapshot
    UpdateReplacePolicy: Snapshot
    Properties:
      AvailabilityZone: !GetAtt Instance.AvailabilityZone
      Size: !Ref DataVolumeSizeGb
      VolumeType: gp3
      Encrypted: true
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-pgdata' }]

  VolumeAttachment:
    Type: AWS::EC2::VolumeAttachment
    Properties:
      InstanceId: !Ref Instance
      VolumeId: !Ref DataVolume
      Device: /dev/sdf

  Instance:
    Type: AWS::EC2::Instance
    Properties:
      ImageId: '{{resolve:ssm:/aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-arm64}}'
      InstanceType: !Ref InstanceType
      KeyName: !Ref KeyPairName
      IamInstanceProfile: !Ref InstanceProfile
      SubnetId: !Ref Subnet
      SecurityGroupIds: [!Ref SecurityGroup]
      BlockDeviceMappings:
        - DeviceName: /dev/xvda
          Ebs: { VolumeSize: 30, VolumeType: gp3, Encrypted: true, DeleteOnTermination: true }
      Tags: [{ Key: Name, Value: !Sub '${ProjectName}-host' }]
      UserData:
        Fn::Base64: !Sub |
          #!/bin/bash
          set -euxo pipefail
          dnf update -y
          dnf install -y docker git
          systemctl enable --now docker
          usermod -aG docker ec2-user

          install -d /usr/local/lib/docker/cli-plugins
          curl -sSL https://github.com/docker/compose/releases/latest/download/docker-compose-linux-aarch64 \
            -o /usr/local/lib/docker/cli-plugins/docker-compose
          chmod +x /usr/local/lib/docker/cli-plugins/docker-compose

          # The database lives on its own volume so the instance stays disposable.
          for i in $(seq 1 30); do [ -e /dev/sdf ] || [ -e /dev/nvme1n1 ] && break; sleep 5; done
          DEV=$(readlink -f /dev/sdf 2>/dev/null || echo /dev/nvme1n1)
          blkid "$DEV" || mkfs -t xfs "$DEV"
          mkdir -p /data
          grep -q "/data" /etc/fstab || echo "$(blkid -s UUID -o value $DEV) /data xfs defaults,nofail 0 2" >> /etc/fstab
          mount -a
          mkdir -p /data/pgdata
          chown -R ec2-user:ec2-user /data

          # Swap keeps a memory spike during a large ETL run from killing the box.
          dd if=/dev/zero of=/swapfile bs=1M count=4096
          chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
          grep -q swapfile /etc/fstab || echo '/swapfile none swap sw 0 0' >> /etc/fstab

          echo "host ready" > /var/log/bootstrap-done

  DnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Ref DomainName
      Type: A
      TTL: 300
      ResourceRecords: [!Ref ElasticIp]

  WwwDnsRecord:
    Type: AWS::Route53::RecordSet
    Condition: HasDns
    Properties:
      HostedZoneId: !Ref HostedZoneId
      Name: !Sub 'www.${DomainName}'
      Type: A
      TTL: 300
      ResourceRecords: [!Ref ElasticIp]

Outputs:
  PublicIp:
    Value: !Ref ElasticIp
  SshCommand:
    Value: !Sub 'ssh -i ~/.ssh/${KeyPairName}.pem ec2-user@${ElasticIp}'
  SsmCommand:
    Value: !Sub 'aws ssm start-session --target ${Instance}'
